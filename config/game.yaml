# The game. Every key is optional (defaults: JumPHP\Kernel\GameConfig::DEFAULTS).
game:
  id: sonic
  title: "SONIC PHP"
  version: 1.0.0
  description: "A fan remake of the Master System hedgehog platformer, written in PHP: the six zones, the bosses, the special stages, best times and ghosts, and matches against computer runners."
  # the original window: a view about 426 px high (zoom 1), as wide as the window allows (Game::updateView
  # resizes JumPHP's view to the window's ratio; 256x192, the Master System screen, with keypad *)
  width: 840
  height: 426
  scale: 2
  background: [0, 0, 0]
  start_scene: App\Scene\GameScene
  lang: en
  online: false
  debug_key: F8                 # F1-F7 are the debug keys of the game itself
  fullscreen_key: F12           # like the original
  # phones: d-pad (run, roll, look up), A = jump, B = roll, START = menus, SELECT = back to the title
  touch: { a: Space, b: Down, start: Return, select: Escape, labels: { a: JUMP, b: ROLL, start: START, select: MENU, rotate: "TURN YOUR PHONE" } }
  controls: "Arrows: run / look up / roll (down) · Space: jump · Enter: menus, pause · Esc: back to the title"
  # the page / window hidden: the act being played pauses (the window losing the focus does not)
  pause_scene: App\Scene\PauseScene
  pause_on_blur: false
  # what `bin/jumphp test` runs headless: the computer runs Green Hill act 1
  smoke:
    scene: App\Scene\GameScene
    params: { level: 1, bot: true }
